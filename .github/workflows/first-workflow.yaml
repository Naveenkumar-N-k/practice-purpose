name: 'Testing list of books endpoint-Simple Books API'
on: workflow_dispatch
jobs: 
  test-files:
    runs-on: windows-latest
    steps:
      - name: Referring our Repo    
        uses: actions/checkout@v7
        
      - name: Installing Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Ensuring Node Version
        run: node --version

      - name: Install Dependencies
        run: npm ci
      
      - name: Install Playwright Browsers 
        run: npx playwright install chromium    # only downloading chromium browser for lesser workload

      - name: Ensuring Playwright Version
        run: npx playwright --version

      - name: Running Playwright Tests
        run: npm run test

      - name: 'Presenting the HTML report' 
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30